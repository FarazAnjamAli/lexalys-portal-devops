# Nginx reverse proxy: public port 80 -> Node app on 127.0.0.1:3000
# Installed to /etc/nginx/sites-available/lexalys-portal by setup.sh
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    # Static files straight from disk, cached for a week.
    location /static/ {
        alias /var/www/lexalys-portal/public/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
